packages:
  - apps/*
  - features/*/*
  - libs/*
  - libs/sync/*
  - tools/*
  - exercises/*

allowBuilds:
  nx: true
  '@swc/core': true
  esbuild: true
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - '@op-engineering/op-sqlite@18.2.5'

overrides:
  smol-toml: 1.8.0
  # GHSA-6j4f-fj2g-mc7p and GHSA-qhr7-859c-m2p7 (high): nx's minimatch resolved 5.0.9.
  'brace-expansion@5': 5.0.12
  # GHSA-3pq3-5fj3-cg6v, GHSA-542g-h47m-68v8 and three more (high, found 2026-09-30):
  # nx 23.2.1, the latest stable, pins axios 1.18.1; patched from 1.20.0.
  'axios@1': 1.20.0
  # GHSA-q3jh-wrc6-jgq8 and GHSA-8r9p-f939-6h3c (high, found 2026-10-21): axios 1.20.0,
  # through nx, resolved follow-redirects 1.16.0; patched from 1.16.1.
  'follow-redirects@1': 1.16.1
  # GHSA-cg2g-xh64-v4q7 (critical) and GHSA-mrv2-3pqr-j5jr (high, found 2026-10-22):
  # mermaid, which builds the docs site's diagrams, resolved dompurify 3.4.16;
  # patched from 3.4.17.
  'dompurify@3': 3.4.17
  # GHSA-4qx8-w7c3-pj3p, GHSA-9j65-hcg3-gc64 and GHSA-9qmh-m7c6-f92p (high, found
  # 2026-10-22): effect-solutions' effect 4.0.0-beta.59 uses toml 4.3.0 to parse CLI
  # files; patched only in 5.0.1, whose one change is that an integer beyond
  # Number.MAX_SAFE_INTEGER throws instead of losing precision.
  'toml@4': 5.0.1
  # GHSA-mrhx-c7xc-m3w5 (high, found 2026-10-24): zod 4.6.5, through @expo/cli
  # and astro, can exhaust memory validating oversized constrained collections;
  # patched from 4.6.6.
  'zod@4': 4.6.6
  # GHSA-xjj6-f33q-929c (high, found 2026-10-24): astro's unifont resolved undici
  # 8.10.2 and 8.11.2, which an excessive content-encoding list crashes;
  # patched from 8.12.2.
  'undici@8': 8.12.2
  '@op-engineering/op-sqlite': 18.2.5
  # One copy of each native Expo module: expo-auth-session's ranges would
  # otherwise pull newer patch releases next to the ones expo 58 bundles.
  expo-constants: 58.0.13
  expo-linking: 58.0.14

auditConfig:
  # Each advisory accepted here is a row in I1, the one issue for advisories
  # that fail audit with no fix released; a human decides each entry, and the
  # row names when it is removed.
  ignoreGhsas:
    # I1: node-forge RSA signature verification (high). No patched release exists
    # (1.4.0 is the newest); it comes only through @expo/cli, a development tool,
    # not through anything the apps ship. Remove when node-forge ships a fix or
    # @expo/cli drops it; `pnpm audit --ignore-unfixable` would hide every future
    # unfixable advisory, so this names the one we accepted.
    - GHSA-86w9-cpqp-85rv
    # I1: http-cache-semantics max-stale cross-user cache disclosure (high). No
    # patched release (4.2.0 is affected); it comes only through astro, which
    # builds the static docs site. Remove when a fix ships or astro drops it.
    - GHSA-ch52-4w7c-c8xp
    # I1: braces stack exhaustion on deeply nested patterns (high). No patched
    # release (3.0.3 is affected); it comes only through micromatch in Metro's
    # file map and starlight-llms-txt, build tools that read our own globs.
    # Remove when a fix ships or both drop it.
    - GHSA-vfj7-8cjw-p6xm
    # I1: zod 3 memory exhaustion validating oversized constrained collections
    # (high). No patched zod 3 (3.25.76 is the newest); it comes only through
    # @expo/cli 58.1.15, a development tool, not through anything the apps ship.
    # zod 4 is overridden to its fix above. Remove when a fix ships or
    # @expo/cli drops zod 3.
    - GHSA-mrhx-c7xc-m3w5
