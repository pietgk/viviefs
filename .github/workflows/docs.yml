# Publishes the docs site (D61''). Runs after CI succeeds on a push to main,
# so a failed verify is not deployed and the next CI run does not cancel a
# deploy that has already started.
name: Docs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: jdx/mise-action@v2

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm exec nx run docs:build
        env:
          CI: true
          DOCS_SITE: https://pietgk.github.io
          DOCS_BASE: /viviefs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/dist

      - id: deployment
        uses: actions/deploy-pages@v5
