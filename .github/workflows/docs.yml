# Publishes the docs site (D61'').
#
# After merge, a green push to main deploys it. Until then, the open pull
# request from docs-github-pages deploys the same URL so the site can be read
# before merge. GitHub Pages has one site, so that preview is the site.
# Another pull request does not match and does not replace it.
name: Docs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') ||
      (github.event_name == 'pull_request' && github.head_ref == 'docs-github-pages')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Select commit
        id: commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          PULL_REQUEST_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$PULL_REQUEST_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.commit.outputs.sha }}

      - uses: jdx/mise-action@v2

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm exec nx run docs:build
        env:
          CI: true
          DOCS_SITE: https://pietgk.github.io
          DOCS_BASE: /viviefs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/dist

      - id: deployment
        uses: actions/deploy-pages@v5
