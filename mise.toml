# Host toolchain plane (D49, ADR 0027). One source of truth for CLIs the human
# and agent invoke on the Mac. Guest runtimes are image digests, not this file.
#
# Node 22.23.2 is the current 22.x that satisfies Expo SDK 58 (>= 22.13) and
# @effect/sql-sqlite-node (>= 22.16). pnpm is the workspace installer. bun is
# required by motel (D45'). Java is admitted for the Android emulator and Gradle
# (P01, P02 and P07 fail if the emulator is missing).
#
# Run `mise install` after cloning.

[tools]
node = "22.23.2"
pnpm = "12.5.1"
bun = "1.4.2"
java = "temurin-17.0.19+10"
